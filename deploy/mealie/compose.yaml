services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
    restart: unless-stopped
    ports:
      - "127.0.0.1:9925:9000"
    mem_limit: 1g
    environment:
      ALLOW_SIGNUP: "false"
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam
      BASE_URL: https://kurtfamilyserver.dorper-boa.ts.net:9443
    volumes:
      - mealie-data:/app/data
  connector:
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    restart: unless-stopped
    profiles: [sync]
    user: "1000:1000"
    read_only: true
    mem_limit: 192m
    environment:
      MEALIE_URL: http://mealie:9000
    command: [node, /app/scripts/mealie-sync.mjs, --watch]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../mealie-adapter.js:/app/mealie-adapter.js:ro
      - ../../auto-recipes.js:/app/auto-recipes.js:ro
      - ../../index.html:/app/index.html:ro
      - ./credentials.json:/app/deploy/mealie/credentials.json:ro
      - ./runtime:/app/deploy/mealie/runtime
    depends_on:
      mealie:
        condition: service_healthy
volumes:
  mealie-data:

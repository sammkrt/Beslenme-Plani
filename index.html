<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beslenme">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Samet &amp; Raşe Beslenme Planı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: telefon öncelikli tek sütun (en fazla 640px), altta sabit sekme çubuğu: Bugün / Hafta / Market / Tercihler.
   Tarif detayı sekmelerin üstünde açılan ayrı bir görünümdür. Yazdırma için #print ayrıca doldurulur. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --ink:#16211b; --muted:#59675e; --faint:#8a968e; --line:#e0e6de; --line2:#edf1eb;
  --soft:#f6f8f4; --track:#e8ede6; --shadow:0 1px 2px rgba(22,33,27,.06);
  --accent:#1f6b4f; --accent-soft:#e2eee7; --accent-ink:#ffffff; --accent-deep:#16503b;
  --samet:#2358a0; --samet-soft:#e6eef8; --samet-ink:#1d4c8c;
  --rase:#b04e1c; --rase-soft:#fbede4; --rase-ink:#8f3e14;
  --warn:#a8461a; --warn-bg:#fbe9dc;
  --p1:#e2eee7; --p1-ink:#16503b; --p2:#e6eef8; --p2-ink:#1d4c8c; --p3:#fbede4; --p3-ink:#8f3e14; --p4:#efe8f6; --p4-ink:#5b3a8c;
  --mb:#fdf1d8; --mb-ink:#8a5a00; --ms:#e2eee7; --ms-ink:#1f6b4f; --md:#f6e6dc; --md-ink:#8f3e14;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121714; --surface:#1b221e; --ink:#e8eee9; --muted:#9aa89f; --faint:#6f7c74; --line:#2c3630; --line2:#252e29;
  --soft:#202823; --track:#2a332e; --shadow:none;
  --accent:#6fcf9f; --accent-soft:#1e3529; --accent-ink:#0f1a14; --accent-deep:#8fd9b3;
  --samet:#7fb0ee; --samet-soft:#1c2a3d; --samet-ink:#a9c8f2;
  --rase:#f0a070; --rase-soft:#3a2519; --rase-ink:#f3b993;
  --warn:#f0a36b; --warn-bg:#3a2617;
  --p1:#1e3529; --p1-ink:#8fd9b3; --p2:#1c2a3d; --p2-ink:#a9c8f2; --p3:#3a2519; --p3-ink:#f3b993; --p4:#2c2340; --p4-ink:#c9b3ee;
  --mb:#3a2f17; --mb-ink:#f0cf86; --ms:#1e3529; --ms-ink:#8fd9b3; --md:#3a2519; --md-ink:#f3b993; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1b221e; --ink:#e8eee9; --muted:#9aa89f; --faint:#6f7c74; --line:#2c3630; --line2:#252e29;
  --soft:#202823; --track:#2a332e; --shadow:none;
  --accent:#6fcf9f; --accent-soft:#1e3529; --accent-ink:#0f1a14; --accent-deep:#8fd9b3;
  --samet:#7fb0ee; --samet-soft:#1c2a3d; --samet-ink:#a9c8f2;
  --rase:#f0a070; --rase-soft:#3a2519; --rase-ink:#f3b993;
  --warn:#f0a36b; --warn-bg:#3a2617;
  --p1:#1e3529; --p1-ink:#8fd9b3; --p2:#1c2a3d; --p2-ink:#a9c8f2; --p3:#3a2519; --p3-ink:#f3b993; --p4:#2c2340; --p4-ink:#c9b3ee;
  --mb:#3a2f17; --mb-ink:#f0cf86; --ms:#1e3529; --ms-ink:#8fd9b3; --md:#3a2519; --md-ink:#f3b993; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 104px);display:flex;flex-direction:column;gap:14px}
h1{font:700 32px/1.1 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font:700 18px/1.25 var(--display);margin:0}
h3{font:700 17px/1.25 var(--display);margin:0}
p{margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:13px}
.warnt{color:var(--warn);font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:54px;font-size:16px;border-radius:16px}
.btn.warnb{color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ibtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:inline-grid;place-items:center;flex:none;padding:0}
.ibtn.solid{background:var(--surface);color:var(--ink);border-radius:14px}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px;min-height:44px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:8px 4px 0}
.top>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:0;background:var(--accent-soft);color:var(--accent-deep);font-size:13px;font-weight:600;min-height:32px;flex:none}
.pill.bad{background:var(--warn-bg);color:var(--warn)}
.pill.idle{background:var(--surface);color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
/* Bugün: gün şeridi, günün toplamı, öğün kartları */
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dbtn{border:0;border-radius:14px;min-height:64px;padding:6px 0;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.dbtn .l{font-size:12px;font-weight:600;opacity:.8}
.dbtn .n{font:700 18px/1.1 var(--display)}
.dbtn .b{font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.75}
.dbtn.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.ps{--c:var(--samet);--cs:var(--samet-soft);--ci:var(--samet-ink)}
.pr{--c:var(--rase);--cs:var(--rase-soft);--ci:var(--rase-ink)}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:99px;background:var(--c)}
.bignum{font:700 22px var(--display)}
.meter{position:relative;height:10px;border-radius:99px;background:var(--track);margin:2px 0}
.meter .band{position:absolute;top:-3px;bottom:-3px;border-radius:4px;border:1.5px dashed var(--c);background:var(--cs)}
.meter .fill{position:absolute;top:0;bottom:0;left:0;border-radius:99px;background:var(--c)}
.person{display:flex;flex-direction:column;gap:8px}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12px;color:var(--muted)}
.macros b{display:block;color:var(--ink);font-size:15px}
.macros b.warn{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;font-weight:600}
.chip{padding:3px 8px;border-radius:6px;background:var(--cs);color:var(--ci)}
.tag{padding:2px 6px;border-radius:5px;background:var(--accent);color:var(--accent-ink);letter-spacing:.04em;font-size:11px;font-weight:700;text-transform:uppercase}
.meal-h{padding:16px;display:flex;gap:12px;align-items:flex-start}
.micon{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.micon.k-b{background:var(--mb);color:var(--mb-ink)}.micon.k-s{background:var(--ms);color:var(--ms-ink)}.micon.k-d{background:var(--md);color:var(--md-ink)}
.mbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mbody .eyebrow{display:inline-flex;gap:8px;align-items:center}
.mtitle{border:0;background:none;padding:0;text-align:left;font:700 19px/1.2 var(--display);color:var(--ink);text-wrap:balance}
.mfoot{padding:4px 6px 4px 16px;border-top:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.acts{display:flex;gap:2px}
.batch{margin:0 16px 12px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.batch b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chev{transition:transform .2s;flex:none}
[aria-expanded="false"]>.chev{transform:rotate(-90deg)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--soft);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:8px;text-align:right;white-space:nowrap}
td{border-top:1px solid var(--line2);padding:9px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:16px;white-space:normal}
th:last-child,td:last-child{padding-right:16px}
td+td{font-weight:600}
th.cs{color:var(--samet-ink)}th.cr{color:var(--rase-ink)}
tr.gone td{color:var(--faint);text-decoration:line-through}
.tscroll{overflow-x:auto}
td.warn{color:var(--warn);font-weight:700}
tr.avg td{font-weight:700;background:var(--soft)}
tr.sel td{background:var(--accent-soft)}
/* Hafta */
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.wnav>div{text-align:center;display:flex;flex-direction:column;min-width:0}
.wnav h1{font-size:26px;line-height:1.15}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);min-height:44px}
.cal .l{font-size:12px;font-weight:600;color:var(--muted)}
.cal .num{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:700}
.cal .today .num{background:var(--ink);color:var(--bg)}
.bp{font-size:11.5px;font-weight:700;padding:3px 0;width:100%;border-radius:6px}
.t1{background:var(--p1);color:var(--p1-ink)}.t2{background:var(--p2);color:var(--p2-ink)}.t3{background:var(--p3);color:var(--p3-ink)}.t4{background:var(--p4);color:var(--p4-ink)}
.wact{display:flex;gap:8px;flex-wrap:wrap}
.wact .btn{flex:1 1 140px;min-height:44px;font-size:14px;font-weight:600;border-radius:12px;padding:0 10px;white-space:nowrap}
.plan-h{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.plan-h span{font-size:13px;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.plan li{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 16px;border-top:1px solid var(--line2)}
.plan li>div{flex:1;min-width:0;display:flex;flex-direction:column}
.plan li .eyebrow{font-size:11.5px}
.mname{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px;line-height:1.3;color:var(--ink)}
.avg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.avg2>div{border-radius:14px;padding:12px;background:var(--cs)}
.avg2 .who{color:var(--ci);font-size:13px}
.qc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.qc li{display:flex;gap:8px;align-items:center}
.qc svg{color:var(--accent)}.qc li.bad{color:var(--warn)}.qc li.bad svg{color:var(--warn)}
.fold-h{width:100%;min-height:56px;border:0;background:none;padding:0 12px 0 16px;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink)}
.fold-h .t{flex:1;font:700 17px var(--display)}
.cnt{font-size:13px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--bg);color:var(--muted)}
.cnt.all{background:var(--accent);color:var(--accent-ink)}
.fold-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.fold-b h3{margin-top:4px}
.fold-b .tscroll{margin:0 -16px}
.fold-b ul.note{margin:0;padding-left:18px}
.dayed .dgrid{width:auto}
.dgrid th,.dgrid td{padding:3px;text-align:center;border:0;background:none}
.dgrid tbody th{font-family:var(--display);color:var(--ink);padding-right:8px}
.dcell{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:1rem}
.dcell[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dlist{margin:0;padding-left:18px}
/* Market */
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.prog div{height:100%;background:var(--accent);border-radius:99px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{font-size:16px;min-width:0;min-height:46px;padding:0 12px;border:0;border-radius:12px;background:var(--bg);color:var(--ink)}
.addrow #addn{flex:2 1 150px}.addrow #addq{flex:1 1 80px}
.shop li{display:flex;align-items:center;border-top:1px solid var(--line2)}
.shop label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0 10px 16px;cursor:pointer}
.shop input[type=checkbox]{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.shop .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.shop .nm span{font-weight:600}
.shop .nm small{font-size:12.5px;color:var(--muted)}
.shop .amt{flex:none;max-width:45%;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.shop li.done .nm span,.shop li.done .amt{color:var(--faint);text-decoration:line-through}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sr{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
/* Tarif detayı */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dhead span{font-size:14px;font-weight:700;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted)}
.tags span.on{background:var(--accent);color:var(--accent-ink)}
.pcard{background:var(--surface);border-radius:16px;padding:12px 14px;border-top:4px solid var(--c);display:flex;flex-direction:column}
.pcard .who{color:var(--ci);font-size:13px}
.pcard small{font-size:13px;color:var(--muted)}
.grp{padding:10px 0 6px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);display:flex;align-items:center}
.grp .g{flex:1}
.q{width:64px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.grp .q.cs{color:var(--samet-ink)}.grp .q.cr{color:var(--rase-ink)}
.grp .sp,.ing .sp{width:44px;flex:none}
.ing li{display:flex;align-items:center;border-top:1px solid var(--line2);font-size:14px;min-height:44px}
.ing .nm{flex:1;min-width:0;padding:8px 0 8px 16px}
.ing .q{font-weight:600}
.ing li.gone{color:var(--faint)}.ing li.gone .nm,.ing li.gone .q{text-decoration:line-through}
.bbox{background:var(--accent-soft);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--accent-deep)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bgrid div{background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;color:var(--ink)}
.bgrid b{font:700 17px var(--display)}
.bgrid span{font-size:12.5px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;display:grid;place-items:center}
.two .btn{min-height:52px;border-radius:16px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px 4px 16px;border-top:1px solid var(--line2);min-height:52px}
/* Sekme çubuğu */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
.tabbar>div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:12px;font-weight:600}
.tab span{padding:4px 18px;border-radius:99px;display:grid;place-items:center}
.tab[aria-current="page"]{color:var(--accent-deep);font-weight:700}
.tab[aria-current="page"] span{background:var(--accent-soft)}
#print{display:none}
.flip{transform:rotate(180deg)}
.ibtn.fold{background:var(--bg);color:var(--ink)}
.fold-b.flush{padding:0;gap:0}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) - 48px);transform:translateX(-50%);width:40px;height:40px;border-radius:99px;display:grid;place-items:center;background:var(--surface);color:var(--accent);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:9;pointer-events:none}
#ptr svg{transition:transform .2s}
#ptr.ready svg{transform:rotate(180deg)}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);width:max-content;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#fff;--surface:#fff;--ink:#16211b;--muted:#59675e;--line:#dbe2da;--soft:#f3f5f1;--samet-ink:#1d4c8c;--rase-ink:#8f3e14;--accent:#1f6b4f;--warn:#a8461a;color-scheme:light}
  .app,.tabbar,#toast,#ptr{display:none!important}
  #print{display:block;font-size:11px;line-height:1.4}
  #print h1{font-size:20px;margin-bottom:8px}
  #print h2{font-size:15px;margin:14px 0 4px;padding:4px 8px;background:var(--soft);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print h3{font-size:12.5px;margin:8px 0 2px}
  #print table{font-size:10.5px}
  #print th,#print td{padding:3px 6px;border-top:1px solid var(--line);background:none}
  #print ol{margin:2px 0 0;padding-left:18px}
  #print .pm{break-inside:avoid}
  #print .pb{break-before:page}
  #print ul{list-style:none;margin:0;padding:0;columns:2;column-gap:24px}
  #print .note{font-size:10px}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>

/* Ara öğünleri kahvaltılarla çakışmayacak şekilde sıralar: önce en az yer değiştiren sıralama,

function pairSnacks(b,s,hist){

/* Haftanın tek bir öğününü aynı türden başka tarifle değiştirir: kahvaltı↔kahvaltı, ara öğün↔ara öğün,

   seen = bu öğün için daha önce gösterilenler (art arda basınca hep yeni tarif gelsin diye). */
function swapPick(hist,wi,i,k,seen){
  const w=hist[wi],p=w.plans[i],cur=p[k];

  const used=new Set(w.plans.map(q=>q[k])),prev=hist[wi-1],prevD=new Set(prev?prev.plans.map(q=>q.d):[]);

  if(pool===D){const pts=new Set(w.plans.slice(0,3).filter((q,j)=>j!==i).map(q=>ALL[q.d].pt)),div=c.filter(x=>!pts.has(x.pt));if(div.length)c=div}

  h+='<p class="note" style="padding:10px 16px 14px;border-top:1px solid var(--line2)">Et, tahıl ve bakliyat gramajları aksi yazmadıkça çiğ / kuru ağırlıktır; konserve bakliyat süzülmüş ağırlıktır.'+(ed?' Çıkardığınız malzeme günlük toplamdan düşülür.':'')+'</p></section>';
  if(k==='d'&&n>1)h+='<section class="bbox"><h2>'+(isZ(rec)?n+' gün için toplam':'Tencereye girecek toplam')+'</h2><span style="font-size:13px;margin-top:-6px">2 kişi × '+n+' gün</span>'+
    '<div class="bgrid">'+batchOf(ing,n).map(([a,b])=>'<div><b>'+b+'</b><span>'+esc(a)+'</span></div>').join('')+'</div><p style="font-size:13px">'+
    (isZ(rec)?'Izgara ve balık bekletilmez; her gün o günün porsiyonunu taze pişirin.':'Pilav, yoğurt ve salata günlük hazırlanır; yemek buzdolabında kapalı kapta '+n+' gün saklanır. Tabağa koyarken eti/proteini tartarak paylaştırın.')+'</p></section>';
  h+='<section class="card pad" aria-labelledby="steph"><div class="row"><h2 id="steph">Hazırlanışı</h2>'+((rec.spice||[]).length?'<span class="note">'+rec.spice.map(esc).join(' · ')+'</span>':'')+'</div>'+
    '<ol class="steps">'+rec.steps.map(s=>'<li><span>'+esc(s)+'</span></li>').join('')+'</ol></section>';
  return h+'<div class="two"><button class="btn" data-pref="'+rec.id+':1" aria-pressed="'+(pv===1)+'">'+SV(I.thumb)+'Sevdik</button><button class="btn" data-pref="'+rec.id+':-1" aria-pressed="'+(pv===-1)+'">'+SV(I.thumb,20,2,'flip')+'Sevmedik</button></div>'+
    '<p class="note" style="text-align:center">İkinizin ortak tercihi: sevdikleriniz daha sık gelir, sevmedikleriniz yeni haftalara konmaz.</p>';
}
function emptyHTML(){
  if(sync==='init')return '<p class="note" style="padding:24px 4px">Plan yükleniyor…</p>';
  if(sync==='nopin'||sync==='badpin'||sync==='locked')return '<header class="top"><div><span class="eyebrow">Samet &amp; Raşe</span><h1>Beslenme planı</h1></div>'+syncSpan()+'</header>'+
    '<section class="card pad"><p id="synclong">'+SYNC[sync][3]+'</p><p class="note">PIN her cihazda bir kez girilir.</p><button class="btn primary big" id="pin">'+SV(I.key)+'PIN gir</button></section>';
  return '<header class="top"><div><span class="eyebrow">Beslenme planı</span><h1>Henüz plan yok</h1></div>'+syncSpan()+'</header>'+
    '<section class="card pad"><p class="note">Menüyü hazırlayın; porsiyonlar ikinizin hedefine göre hesaplanır.</p><button class="btn primary big" id="wnew">'+SV(I.plus)+'Bu haftanın menüsünü hazırla</button></section>';
}
function render(){
  const w=hist[cur],focus=document.activeElement&&document.activeElement.id;
  $('tabs').innerHTML=tabsHTML();
  if(!w){detail=null;$('view').innerHTML=tab==='prefs'?prefsHTML():emptyHTML();return}
  const plans=build(w);
  $('view').innerHTML=detail?detailHTML(w,plans):tab==='week'?weekHTML(w,plans):tab==='shop'?shopHTML(w,plans):tab==='prefs'?prefsHTML():todayHTML(w,plans);
  if(!detail&&tab==='shop'){$('shoptxt').value=shopText(w,plans);
    if(focus==='addn'||focus==='addq'){const e=$(focus);e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
}
function setTab(t){tab=t;detail=null;editDays=null;confirmKey=null;lsSet('beslenme-tab',t);render();window.scrollTo({top:0});
  if(t==='shop'&&canPoll()){lastPoll=Date.now();pull()}} // diğer telefonun işaretlerini hemen al
/* Yeniden oluştur / sil: ilk dokunuşta düğme "Emin misin?" olur, 4 sn içinde ikinci dokunuş onaylar. */
let confirmKey=null;
function arm(k){confirmKey=k;render();clearTimeout(arm.t);arm.t=setTimeout(()=>{if(confirmKey===k){confirmKey=null;render()}},4000)}
function go(i){cur=i;day=defDay();confirmKey=null;editDays=null;detail=null;render()}
/* Yeni hafta: bu hafta yoksa bu hafta, varsa gelecek hafta hazırlanır; en fazla 1 hafta ileriye. */
function newWeek(){
  window.scrollTo({top:0});
  if(nextStart(hist)>addDays(thisMon(),7)){cur=hist.length-1;day=defDay();render();toast('Gelecek haftanın menüsü zaten hazır');return}
  const w=generate(hist);confirmKey=null;doOp({t:'new',w},()=>{cur=hist.findIndex(x=>x.start===w.start);day=defDay()});toast(weekLabel(w)+' hazır');
}
document.addEventListener('click',e=>{
  const t=e.target,c=s=>t.closest?t.closest(s):null;let b;
  if(b=c('[data-tab]')){setTab(b.dataset.tab);return}
  if(b=c('[data-fold]')){toggleFold(b.dataset.fold);return}
  if(b=c('[data-open]')){const[pi,k]=b.dataset.open.split(':');detail={pi:+pi,k,y:window.scrollY};editDays=null;confirmKey=null;render();window.scrollTo({top:0});return}
  if(c('#back')){const y=detail?detail.y:0;detail=null;render();window.scrollTo({top:y});return}
  if(b=c('[data-day]')){day=+b.dataset.day;render();return}
  if(b=c('[data-goday]')){day=+b.dataset.goday;setTab('today');return}
  if(c('[data-pdf]')){pdf();return}
  if(c('[data-copy]')){const ta=$('shoptxt');(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Liste kopyalandı')).catch(()=>{ta.focus();ta.select();toast('Metin seçildi, Kopyala’ya basın')});return}
  if(b=c('[data-dc]')){const[i,d]=b.dataset.dc.split(':').map(Number),o=editDays.findIndex(a=>a.includes(d));
    if(o===i)return;
    if(editDays[o].length===1)return toast('BESLENME '+(o+1)+' en az 1 gün olmalı; önce ona başka bir gün verin');
    if(editDays[i].length===3)return toast('Bir BESLENME en fazla 3 gün olabilir');
    editDays[o]=editDays[o].filter(x=>x!==d);editDays[i]=[...editDays[i],d].sort((a,b)=>a-b);render();return}
  if(b=c('[data-swap]')){const[i,k]=b.dataset.swap.split(':'),p=hist[cur].plans[+i],key=hist[cur].no+':'+b.dataset.swap,seen=swapSeen[key]||(swapSeen[key]=new Set());
    seen.add(p[k]);const id=swapPick(hist,cur,+i,k,seen);if(!id){toast('Bu öğün için uygun başka tarif yok');return}
    const old=ALL[p[k]].name;seen.add(id);doOp({t:'swap',i:+i,k,id});toast(old+' → '+ALL[id].name);return}
  if(b=c('[data-pref]')){const[id,v]=b.dataset.pref.split(':'),n=+v,name=ALL[id].name;
    if(PREFS[id]===n){doOp({t:'pref',id,v:0});toast(name+': tercih kaldırıldı')}
    else{doOp({t:'pref',id,v:n});toast(n===1?'👍 '+name+' daha sık gelecek':'👎 '+name+' bir daha önerilmeyecek'+(editable(hist[cur])?'. Bu haftadan çıkarmak için “Başka … getir”':''))}
    return}
  if(b=c('[data-unpref]')){const name=ALL[b.dataset.unpref].name;doOp({t:'pref',id:b.dataset.unpref,v:0});toast(name+': tercih kaldırıldı');return}
  if(b=c('[data-rm]')){const[pi,k,j]=b.dataset.rm.split(':'),p=hist[cur].plans[+pi],n=+j,on=!((p.x&&p.x[k])||[]).includes(n);
    const row=build({plans:hist[cur].plans})[+pi].ing[k][n],name=F[row[0]].n.replace(/ \(.*\)/,'');
    const kc=v=>Math.round(F[row[0]].u==='adet'||F[row[0]].u==='ölçek'?F[row[0]].m[0]*v:F[row[0]].m[0]*v/100);
    doOp({t:'rm',i:+pi,k,j:n,on});toast(on?name+' çıkarıldı: günde Samet −'+kc(row[1])+' kcal, Raşe −'+kc(row[2])+' kcal':name+' geri eklendi');return}
  if(t.dataset&&t.dataset.ck!==undefined){check(t.dataset.ck,t.checked);return}
  if(b=c('[data-del]')){const x=(hist[cur].extra||[]).find(e=>e.k===b.dataset.del);doOp({t:'del',k:b.dataset.del});if(x)toast(x.n+' listeden silindi');return}
  if(b=c('[data-qty]')){const v=prompt('Alınacak miktar (ör. 2 paket, 1 kg). Boş bırakırsanız hesaplanan miktara döner:',b.dataset.cur);
    if(v!==null){const q=v.trim().slice(0,40);doOp({t:'qty',k:b.dataset.qty,v:q});toast(q?'Miktar düzeltildi: '+q:'Hesaplanan miktara dönüldü')}return}
  const id=(c('button[id]')||{}).id;
  if(id==='wprev'){if(cur>0)go(cur-1)}
  else if(id==='wnext'){if(cur<hist.length-1)go(cur+1)}
  else if(id==='wnow')go(pickCur());
  else if(id==='wnew')newWeek();
  else if(id==='wdays'){editDays=editDays?null:hist[cur].plans.map((p,i)=>daysOf(p,i).slice());render()}
  else if(id==='dcancel'){editDays=null;render()}
  else if(id==='dsave'){const days=editDays;editDays=null;doOp({t:'days',days},()=>{day=defDay()});toast('Günler kaydedildi')}
  else if(id==='wregen'){if(confirmKey!=='regen')return arm('regen');confirmKey=null;
    const w=hist[cur],marked=(w.done||[]).length;doOp({t:'regen',plans:generate(hist.slice(0,cur+1)).plans}); // bu haftanın akşamları da "geçen hafta" sayılır, böylece farklı menü gelir
    toast(weekLabel(w)+' menüsü yeniden oluşturuldu'+(marked?'; market işaretleri sıfırlandı':''))}
  else if(id==='wdel'){if(confirmKey!=='del')return arm('del');confirmKey=null;
    const lbl=weekLabel(hist[cur]);doOp({t:'wdel'},()=>{cur=pickCur();day=defDay();detail=null});toast(lbl+' silindi')}
  else if(id==='ckclear'){const w=hist[cur],n=(w.done||[]).length;
    if(n&&confirm('Emin misiniz? '+n+' kalemin işareti kaldırılacak. Bu, iki telefonda da geçerli olur.')){w.done.slice().forEach(k=>check(k,false));toast('İşaretler temizlendi')}}
  else if(id==='pin'){const p=prompt('Ortak PIN (Samet ve Raşe aynı PIN’i kullanır):',pin);if(p!==null){pin=p.trim();lsSet('beslenme-pin',pin);
    if(pin){setSync('init');render();lastPoll=Date.now();pull().then(r=>{firstRun(r);render();if(sync==='ok')toast('PIN doğru, plan eşitlendi')})}else{setSync('nopin');render()}}}
  else if(id==='pdfClose')$('pdfhelp').hidden=true;
});
/* ===== YAZDIRMA: tüm hafta (öğün tabloları + besin değerleri + market listesi) #print'e yazılır ===== */
function printHTML(w,plans){
  let h='<h1>'+esc(weekLabel(w))+' – Samet &amp; Raşe Beslenme Planı</h1><p class="note">Samet: '+T.s.lo+'–'+T.s.hi+' kcal, en az '+T.s.pmin+' g protein · Raşe: '+T.r.lo+'–'+T.r.hi+' kcal, 95–110 g protein</p>';
  plans.forEach((p,i)=>{h+='<h2>BESLENME '+(i+1)+' – '+dayText(p.days)+' ('+p.days.length+' gün)</h2>';
    ['b','s','d'].forEach(k=>{const rec=recOf(p,k),ing=p.ing[k].filter(x=>!x[4]),ms=mac(ing,1),mr=mac(ing,2),n=p.days.length;
      h+='<div class="pm"><h3>'+KL[k]+': '+esc(rec.name)+'</h3><table><thead><tr><th>Malzeme</th><th>Samet</th><th>Raşe</th></tr></thead><tbody>'+
        ing.map(x=>'<tr><td>'+esc(F[x[0]].n)+'</td><td>'+amt(x[0],x[1])+'</td><td>'+amt(x[0],x[2])+'</td></tr>').join('')+
        '<tr><td>Öğün toplamı</td><td>'+r0(ms[0])+' kcal · '+r0(ms[1])+' g P</td><td>'+r0(mr[0])+' kcal · '+r0(mr[1])+' g P</td></tr></tbody></table><ol>'+rec.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+
        (k==='d'&&n>1?'<p class="note"><b>'+(isZ(rec)?n+' gün için toplam (2 kişi):':'Tencereye girecek toplam (2 kişi × '+n+' gün):')+'</b> '+batchOf(p.ing[k],n).map(([a,b])=>esc(a)+' '+b).join(' · ')+'</p>':'')+'</div>'})});
  h+='<div class="pb"><h1>Günlük besin değerleri</h1>'+nutriHTML(plans)+'</div>';
  const sh=shopping(plans),done=w.done||[],qty=w.qty||{},li=x=>'<li>'+(done.includes(x.k)?'☑':'☐')+' '+esc(x.n)+(qty[x.k]||x.buy?' — '+esc(qty[x.k]||x.buy):'')+(x.need&&!qty[x.k]?' ('+x.need+')':'')+'</li>';
  h+='<div class="pb"><h1>'+rangeLabel(w.start)+' – Market alışveriş listesi</h1>';
  if((w.extra||[]).length)h+='<h2>'+EXL+'</h2><ul>'+w.extra.map(li).join('')+'</ul>';
  SECS.forEach(([k])=>{if(sh[k].length)h+='<h2>'+SECL[k]+'</h2><ul>'+sh[k].map(li).join('')+'</ul>'});
  return h+'</div>';
}
/* iOS ana ekran uygulamasında window.print() hiçbir şey yapmaz: sayfayı ?pdf=1 ile Safari'de açtırıp orada yazdırırız. */
function printNow(){const w=hist[cur];if(!w)return;$('print').innerHTML=printHTML(w,build(w));setTimeout(()=>window.print(),50)}
function pdf(){
  if(navigator.standalone!==true)return printNow();
  const u=location.origin+location.pathname+'?pdf=1';
  $('pdfSafari').href='x-safari-'+u;$('pdfAlt').href=u;$('pdfhelp').hidden=false;window.scrollTo({top:0});
}
const wantPdf=new URLSearchParams(location.search).has('pdf');
if(wantPdf)history.replaceState(null,'',location.pathname); // yenileyince tekrar yazdırmasın
if(hist.length){cur=pickCur();day=defDay()}
render();
pull().then(r=>{firstRun(r);
  render();
  if(wantPdf){toast('Yazdırma penceresi açılmazsa PDF olarak indir’e dokunun');printNow()}}); // sunucudaki güncel plan geldikten sonra yazdır
addEventListener('online',()=>{if(dirty)push()});
/* Market listesine ürün ekleme formu */
document.addEventListener('input',e=>{if(e.target.id==='addn')addDraft.n=e.target.value;else if(e.target.id==='addq')addDraft.q=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='addform')return;e.preventDefault();
  const n=addDraft.n.trim().slice(0,60),q=addDraft.q.trim().slice(0,40);if(!n){$('addn').focus();return}
  if((hist[cur].extra||[]).length>=60)return toast('Bir haftaya en fazla 60 ürün eklenebilir');
  addDraft={n:'',q:''};doOp({t:'add',k:'u_'+Date.now().toString(36).slice(-7)+Math.random().toString(36).slice(2,5),n,q});toast(n+' listeye eklendi');$('addn').focus()});
/* Diğer telefondaki değişiklikleri getir: Market sekmesi açıkken 5 sn'de, değilse 60 sn'de bir; sekme görünürken. */
let lastPoll=Date.now();
const shopInView=()=>tab==='shop'&&!detail;
const canPoll=()=>!document.hidden&&!dirty&&!['nopin','badpin','locked'].includes(sync); // hatalı PIN'le yoklamak kilitlenmeye yol açar
setInterval(()=>{if(!canPoll()||!shopInView()&&Date.now()-lastPoll<60000)return;lastPoll=Date.now();pull()},5000);
document.addEventListener('visibilitychange',()=>{if(canPoll()){lastPoll=Date.now();pull()}});
if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{}); // çevrimdışı açılış
/* Aşağı çekip yenile: tarayıcılar bunu kendisi yapar, yalnızca ana ekran uygulamasında (standalone) etkin. */
if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches){
  const ind=$('ptr'),MAX=90,AT=64;let y0=null,d=0;
  const pos=v=>ind.style.transform='translate(-50%,'+v+'px)';
  addEventListener('touchstart',e=>{y0=scrollY<=0&&e.touches.length===1?e.touches[0].clientY:null;d=0},{passive:true});
  addEventListener('touchmove',e=>{if(y0===null)return;d=Math.max(0,Math.min((e.touches[0].clientY-y0)*0.5,MAX));
    if(scrollY>0&&d===0){y0=null;return}ind.style.transition='none';pos(d);ind.classList.toggle('ready',d>=AT)},{passive:true});
  addEventListener('touchend',()=>{if(y0===null)return;y0=null;ind.style.transition='transform .2s';
    if(d>=AT){pos(AT);ind.classList.remove('ready');ind.classList.add('spin');setTimeout(()=>location.reload(),150)}else pos(0)},{passive:true});
}
}

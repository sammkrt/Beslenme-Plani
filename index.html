<title>Samet &amp; Raşe Beslenme Planı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: tek sütun, üstte yapışkan eylem çubuğu; her BESLENME bir kart, öğünler kart içinde Malzeme | Samet | Raşe tablosu. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1d2620; --muted:#5d6b62; --line:#dbe2da;
  --accent:#1f6b4f; --accent-ink:#ffffff; --samet:#1b5f7a; --rase:#8a2f5c;
  --soft:#e8efe7; --warn:#b4541a; --warn-bg:#fbe9dc; --ok:#1f6b4f;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131815; --surface:#1c231f; --ink:#e8eee9; --muted:#9aa89f; --line:#2f3a33;
  --accent:#6fcf9f; --accent-ink:#0f1a14; --samet:#7cc4e0; --rase:#eb9cc2;
  --soft:#242d28; --warn:#f0a36b; --warn-bg:#3a2617; --ok:#6fcf9f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131815; --surface:#1c231f; --ink:#e8eee9; --muted:#9aa89f; --line:#2f3a33;
  --accent:#6fcf9f; --accent-ink:#0f1a14; --samet:#7cc4e0; --rase:#eb9cc2;
  --soft:#242d28; --warn:#f0a36b; --warn-bg:#3a2617; --ok:#6fcf9f; color-scheme:dark }
*{box-sizing:border-box}
html{color-scheme:light dark}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#ffffff;--surface:#ffffff;--ink:#1d2620;--muted:#5d6b62;--line:#dbe2da;--accent:#1f6b4f;--accent-ink:#ffffff;--samet:#1b5f7a;--rase:#8a2f5c;--soft:#eef3ed;--warn:#b4541a;--warn-bg:#fbe9dc;--ok:#1f6b4f;color-scheme:light}
  .bar,.weeks,#toast,textarea,#copy,.sub,.swap{display:none!important}
  .wrap{max-width:none;padding:0;gap:12px}
  body{font-size:11.5px}
  .meal,.prep,tr,.card h2{break-inside:avoid}
  .plan{overflow:visible}
  .plan-head,.prep,.badge,.qc span,td.warn{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #shop,#nutri{break-before:page}
  @page{size:A4;margin:14mm}
}
body{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:1.1rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}
button{font:600 0.92rem var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:5px 10px;font-size:.82rem}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.weeks span{color:var(--muted);font-size:.85rem;margin-right:4px}
.weeks .sync{margin-left:auto}
.weeks .sync.bad{color:var(--warn)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.target{border-left:4px solid var(--samet);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0}
.target.r{border-left-color:var(--rase)}
.target b{font-family:var(--display)}
.target div{color:var(--muted);font-size:.88rem}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plan-head{background:var(--soft);padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.plan-head .no{font-family:var(--display);font-weight:700;font-size:1.2rem}
.plan-head .freq{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.plan-head .days{font-weight:600}
.meal{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:4px;vertical-align:middle;margin-left:6px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap;width:1%;padding-left:14px}
.cs{color:var(--samet);font-weight:600}.cr{color:var(--rase);font-weight:600}
tr.sum td{border-bottom:0;font-size:.85rem;color:var(--muted)}
tr.avg td{font-weight:700;border-top:2px solid var(--line)}
td.warn{background:var(--warn-bg);color:var(--warn);font-weight:700}
.prep{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:.92rem}
.prep ol{margin:6px 0 0;padding-left:20px}
.prep .batch{margin-top:8px;font-size:.86rem;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qc{display:flex;flex-wrap:wrap;gap:6px}
.qc span{font-size:.8rem;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ok);font-weight:600}
.qc span.bad{color:var(--warn);background:var(--warn-bg)}
.shop h4{margin:12px 0 4px;font:700 .95rem var(--display)}
.shop ul{list-style:none;margin:0;padding:0}
.shop li{padding:5px 0;border-bottom:1px solid var(--line)}
.shop label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.shop input{margin-top:4px;accent-color:var(--accent)}
.shop small{color:var(--muted)}
.shop input:checked + span{text-decoration:line-through;color:var(--muted)}
textarea{width:100%;min-height:160px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;z-index:9}
@media (max-width:640px){.bar{position:static}}
</style>
</head>

</div>

  const prev=hist[cur-1],rep=prev?w.plans.filter(p=>prev.plans.some(q=>q.d===p.d)).length:0;
  const qc=[['7 gün',plans.reduce((a,p)=>a+p.days.length,0)===7],['4 akşam pişirmesi',true],['Aynı yemek, farklı porsiyon',true],['Kalori ve protein hedefte',warn===0],['Geçen haftanın akşamı tekrar etmiyor',rep===0]];
  nh+='<div class="qc">'+qc.map(q=>'<span class="'+(q[1]?'':'bad')+'">'+(q[1]?'✓ ':'! ')+q[0]+'</span>').join('')+'</div><p class="note">Değerler, yazılı gramajlardan yaklaşık besin değerleriyle hesaplanır (karbonhidrat net, lif ayrı). Renkli hücre hedef dışı günü gösterir. Et, tahıl ve bakliyat gramajları aksi yazmadıkça çiğ/kuru ağırlıktır; konserve bakliyat süzülmüş (pişmiş) ağırlıktır.</p>';
  $('nutri').innerHTML=nh;
  $('flex').innerHTML='<h2>Kontrollü esnek öğün</h2><p class="note">Haftada en fazla 1 akşam yemeği, tercihen Pazar akşamının yerine. O gün kahvaltı ve ara öğün aynen uygulanır. Hedef: Samet için yaklaşık 700–800 kcal, Raşe için 550–650 kcal.</p><ul class="note"><li>İnce hamur pizza: Samet 3 dilim, Raşe 2 dilim + büyük yeşil salata</li><li>Suşi (tempurasız): Samet 10–12 parça, Raşe 8 parça + edamame</li><li>Ekmeğin yarısıyla burger + patates yerine salata</li><li>Türk restoranı: tavuk şiş / ızgara köfte + salata; pilavdan 3–4 YK, lavaş yok</li></ul><p class="note">Takviyeler ve su: D vitamini ve omega-3 kahvaltıyla, magnezyum yatmadan önce; günde 2,5–3 L su.</p>';
  renderShop(w,plans);
}
function renderShop(w,plans){
  const el=$('shop');el.hidden=!shopOpen;if(!shopOpen)return;
  const sh=shopping(plans);let h='<h2>Hafta '+w.no+' – Market alışveriş listesi</h2><p class="note">Samet + Raşe toplamı, 7 gün. Her BESLENME’nin kaç gün uygulandığı hesaba katılır; miktarlar market paketine yuvarlanır.</p>';
  let n=0;SECS.forEach(([k,l])=>{if(!sh[k].length)return;h+='<h4>'+l+'</h4><ul>'+sh[k].map(x=>'<li><label><input type="checkbox" id="ck'+(n++)+'"><span>'+esc(x.n)+' — <b>'+x.buy+'</b>'+(x.need?' <small>(gerekli: '+x.need+')</small>':'')+'</span></label></li>').join('')+'</ul>'});
  h+='<div><button id="copy">Listeyi kopyala (Apple Notes)</button></div><textarea id="shoptxt" readonly aria-label="Kopyalanabilir alışveriş listesi"></textarea>';
  el.innerHTML=h;$('shoptxt').value=shopText(w,plans);
}
$('btnNew').onclick=()=>{hist.push(generate(hist));if(hist.length>26)hist.shift();cur=hist.length-1;save();render();toast('Hafta '+hist[cur].no+' hazır');window.scrollTo({top:0})};
$('btnShop').onclick=()=>{shopOpen=true;render();$('shop').scrollIntoView({behavior:'smooth',block:'start'})};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.w!==undefined){cur=+t.dataset.w;render()}
  else if(t.id==='reset'){if(t.dataset.sure){hist=[generate([])];cur=0;save();render();toast('Geçmiş silindi, Hafta 5 yeniden hazırlandı')}else{t.dataset.sure=1;t.textContent='Emin misin? Tekrar tıkla'}}
  else if(t.dataset&&t.dataset.swap){const[i,k]=t.dataset.swap.split(':'),p=hist[cur].plans[+i],key=hist[cur].no+':'+t.dataset.swap,seen=swapSeen[key]||(swapSeen[key]=new Set());
    seen.add(p[k]);const id=swapPick(hist,cur,+i,k,seen);if(!id){toast('Bu öğün için uygun başka tarif yok');return}
    const old=ALL[p[k]].name;p[k]=id;seen.add(id);save();render();toast(old+' → '+ALL[id].name)}
  else if(t.id==='pin'){const p=prompt('Ortak PIN (Samet ve Raşe aynı PIN’i kullanır):',pin);if(p!==null){pin=p.trim();lsSet('beslenme-pin',pin);render();if(pin){dirty=true;saveLocal();push().then(()=>{if(sync==='ok')toast('PIN doğru, plan buluta kaydedildi')})}else setSync('nopin')}}
  else if(t.id==='copy'){const ta=$('shoptxt');(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Liste kopyalandı')).catch(()=>{ta.focus();ta.select();toast('Metin seçildi, Kopyala’ya basın')})}
});
$('btnPdf').onclick=()=>{shopOpen=true;render();setTimeout(()=>window.print(),50)};
if(hist.length){cur=hist.length-1;render()}else $('menu').innerHTML='<p class="note">Plan yükleniyor…</p>';
pull().then(()=>{if(!hist.length){hist.push(generate([]));cur=0;save();render()}});
addEventListener('online',()=>{if(dirty)push()});
}
</script>
